<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foreach Method</title>   

</head>
<body>
    <script>



    let numbers = [1,2,3,4,5,6,7,8];
    numbers.forEach(display);

    function display(element)
    {
        console.log(element);
    }
    </script>
</body>
</html>
