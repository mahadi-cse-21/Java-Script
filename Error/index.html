<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
</head>
<body>
    <script>
        try {
            console.log("hello");
        } catch (error) {
            console.log(error);
            
        }
        finally{
            console.log("this always execute");
        }
        
        console.log("this is the end");
    </script>
</body>
</html>
